<body class="qm">
  <header class="qm-head">
    <div class="qm-cover" aria-hidden="true"><picture><source type="image/avif" srcset="assets/img/aiyr/coperta-480.avif 480w, assets/img/aiyr/coperta-960.avif 960w, assets/img/aiyr/coperta.avif 1440w" sizes="100vw"><img src="assets/img/aiyr/coperta.webp" srcset="assets/img/aiyr/coperta-480.webp 480w, assets/img/aiyr/coperta-960.webp 960w, assets/img/aiyr/coperta.webp 1440w" sizes="100vw" width="1440" height="1800" alt="Imagine ilustrativă. Cești de cafea cu lapte, pe o masă de lemn." fetchpriority="high"></picture></div>
    <div class="qm-head-copy">
      <a class="wordmark" href="index.html"><span>AIYR</span><small>coffee</small></a>
      <h1>Meniu</h1>
      <p>Strada Războieni 1, Dorohoi</p>
    </div>
  </header>

  <nav class="qm-nav" aria-label="Categorii" hidden></nav>

  <main class="qm-main"><p>Meniul online este în pregătire.</p></main>

  <footer class="qm-foot">
    <a class="text-link" href="index.html">Înapoi la site <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 18 18 6M7 6h11v11"/></svg></a>
  </footer>

  <script>
    // Categoria pe care o citești rămâne aprinsă sus.
    (() => {
      const chips = [...document.querySelectorAll(".qm-chip")];
      const bar = document.querySelector(".qm-nav");
      const mark = (id) => chips.forEach((chip) => {
        const on = chip.hash === "#" + id;
        chip.toggleAttribute("aria-current", on);
        if (on) bar.scrollTo({ left: chip.offsetLeft - 16, behavior: "smooth" });
      });
      const seen = new IntersectionObserver((entries) => {
        for (const entry of entries) if (entry.isIntersecting) mark(entry.target.id);
      }, { rootMargin: "-30% 0px -60% 0px" });
      document.querySelectorAll(".qm-section").forEach((section) => seen.observe(section));
    })();
  </script>
</body>
</html>
