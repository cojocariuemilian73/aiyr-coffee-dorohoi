<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{menuPageTitle}}</title>
  <meta name="description" content="{{menuPageDescription}}">
  {{demoRobots}}
  <meta name="theme-color" content="#19251D">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="{{favicon}}" type="image/png" sizes="64x64">
  <link rel="preload" href="assets/fonts/cormorant-ro.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css?v={{vCss}}">
  <link rel="stylesheet" href="assets/css/meniu.css?v={{vMenuCss}}">
</head>
<body class="qm">
  <header class="qm-head">
    <div class="qm-cover" aria-hidden="true">{{cover}}</div>
    <div class="qm-head-copy">
      <a class="wordmark" href="index.html">{{logo}}</a>
      <h1>Meniu</h1>
      <p>{{menuAddress}}</p>
      {{menuDemoNotice}}
    </div>
  </header>

  <nav class="qm-nav" aria-label="Categorii"{{categoriesHidden}}>{{chips}}</nav>

  <main class="qm-main">{{menuEmptyNotice}}{{sections}}{{menuNotes}}</main>

  <footer class="qm-foot">
    <a class="text-link" href="index.html">{{menuPageStory}} {{arrowOut}}</a>
    {{tableCardLink}}
    {{photoCredits}}
  </footer>

  <script>
    // Categoria pe care o citești rămâne aprinsă sus.
    (() => {
      const chips = [...document.querySelectorAll(".qm-chip")];
      const bar = document.querySelector(".qm-nav");
      const mark = (id) => chips.forEach((chip) => {
        const on = chip.hash === "#" + id;
        chip.toggleAttribute("aria-current", on);
        if (on) bar.scrollTo({ left: chip.offsetLeft - 16, behavior: "smooth" });
      });
      const seen = new IntersectionObserver((entries) => {
        for (const entry of entries) if (entry.isIntersecting) mark(entry.target.id);
      }, { rootMargin: "-30% 0px -60% 0px" });
      document.querySelectorAll(".qm-section").forEach((section) => seen.observe(section));
    })();
  </script>
</body>
</html>
